datasets:
  - name: "MNIST"
    folder: "data/mnist_32"
    num_classes: 10

  - name: "Gap_MNIST"
    folder: "data/mnist_skip_32"
    num_classes: 10

  - name: "Texture_MNIST"
    folder: "data/texture_mnist_32"
    num_classes: 10

  - name: "SVHN"
    folder: "data/house_mnist_32"
    num_classes: 10

  - name: "Cifar10"
    folder: "data/cifar10_32"
    num_classes: 10

  - name: "Smear_Cifar10"
    folder: "data/cifar10_smear_32"
    num_classes: 10

  - name: "Cut_Cifar10"
    folder: "data/cifar10_cut_32"
    num_classes: 10

  - name: "Amazon"
    folder: "data/amazon"
    num_classes: 31
  
  - name: "DSLR"
    folder: "data/dslr"
    num_classes: 31
  
  - name: "Webcam"
    folder: "data/webcam"
    num_classes: 31
  
  - name: "Clipart"
    folder: "data/Clipart"
    num_classes: 65

  - name: "Real World"
    folder: "data/RealWorld"
    num_classes: 65

  - name: "Product"
    folder: "data/Product"
    num_classes: 65

  - name: "Art"
    folder: "data/Art"
    num_classes: 65

dataset_pairs:
  # train/val splits are derived in run_main.py; target_*_size (image counts) override the dataset-family defaults
  # (source sets use a 70 / 15 / 15 split)

  # MNIST -> SVHN (target SVHN of 99,289 images)
  - target: "SVHN"
    source: "MNIST"
    target_train_size: 1000
    target_val_size: 1000
    target_test_size: 10000

  # Webcam -> Amazon (target Amazon of 2,817 images)
  - target: "Amazon"
    source: "Webcam"
    target_train_size: 1000
    target_val_size: 400
    target_test_size: 1400

  # - target: "MNIST"
  #   source: "SVHN"
  #
  # - target: "MNIST"
  #   source: "Gap_MNIST"
  #   paired: true  # same digits as MNIST, so held-out MNIST digits are removed from the source
  #
  # - target: "MNIST"
  #   source: "Texture_MNIST"
  #
  # - target: "Amazon"
  #   source: "DSLR"
  # (other Office-31 / Cifar10 pairs: see git history)

image_sizes:
  - "small"  # 32px practice run; "large" is 224px, which does not fit in memory with the no-stride ResNet-9

unet_loss:
  - "ebsw"

unet_attention:
  - False

# Variants run for every combination above, on top of "normal" (definitions and how to add one: ablations.py)
ablations:
  # - normal
  # - unfreeze_body
  # - no_inner_loop
  - unfreeze_no_inner

# Default target train size for MNIST / SVHN targets when a pair does not set target_train_size. Keep a single value
# (a list multiplies the runs). The small-target experiment is in configs/META_config_small_target.yaml.
target_train_sizes:
  - 1000
