datasets:
  - name: "MNIST"
    folder: "data/mnist_32"
    num_classes: 10

  - name: "Gap_MNIST"
    folder: "data/mnist_skip_32"
    num_classes: 10

  - name: "Texture_MNIST"
    folder: "data/texture_mnist_32"
    num_classes: 10

  - name: "SVHN"
    folder: "data/house_mnist_32"
    num_classes: 10

  - name: "Cifar10"
    folder: "data/cifar10_32"
    num_classes: 10

  - name: "Smear_Cifar10"
    folder: "data/cifar10_smear_32"
    num_classes: 10

  - name: "Cut_Cifar10"
    folder: "data/cifar10_cut_32"
    num_classes: 10

  - name: "Amazon"
    folder: "data/amazon"
    num_classes: 31
  
  - name: "DSLR"
    folder: "data/dslr"
    num_classes: 31
  
  - name: "Webcam"
    folder: "data/webcam"
    num_classes: 31
  
  - name: "Clipart"
    folder: "data/Clipart"
    num_classes: 65

  - name: "Real World"
    folder: "data/RealWorld"
    num_classes: 65

  - name: "Product"
    folder: "data/Product"
    num_classes: 65

  - name: "Art"
    folder: "data/Art"
    num_classes: 65

dataset_pairs:
  # train/val splits are derived in run_main.py
  - target: "MNIST"
    source: "Gap_MNIST"
    paired: true  # same digits as MNIST, so held-out MNIST digits are removed from the source

  - target: "MNIST"
    source: "Texture_MNIST"

  - target: "MNIST"
    source: "SVHN"

  # - target: "Cifar10"
  #   source: "Cut_Cifar10"

  - target: "Amazon"
    source: "DSLR"

  - target: "Amazon"
    source: "Webcam"

  - target: "DSLR"
    source: "Webcam"
    
  - target: "DSLR"
    source: "Amazon"

  - target: "Webcam"
    source: "Amazon"

  - target: "Webcam"
    source: "DSLR"

image_sizes:
  - "small"

unet_loss:
  - "ebsw"

unet_attention:
  - False
