dataset:
  target:
    name: "MNIST"
    folder: "data/mnist_v2"
    train_pct: 0.02
    val_pct: 0.3
    num_classes: 10

  source:
    name: "texture_mnist"
    folder: "data/texture_mnist_32"
    train_pct: 0.98
    val_pct: 0.01
    num_classes: 10

  image_size: "small"
  rng_seed: 72
  batch_size: 64

save_locations:
  model_folder: "models"
  file_folder: "files"
  image_folder: "images"
  logs_folder : "logs"

classifier:
  model: "resnet9"
  identifier: "MNIST+TextureMNIST" # unique identifier for the set of models
  num_epochs: 100

unet:
  loss: "ebsw"
  attention: false
  base_channels: 32
  noise_channels: 8
  num_warm_start_epochs: 20
  num_epochs: 100

verbose: false