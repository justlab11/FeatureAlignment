dataset:
  target:
    name: amazon
    folder: ./data/dslr-amazon-1/amazon
    train_pct: 0.02
    val_pct: 0.3
    num_classes: 31
  source:
    name: dslr
    folder: ./data/dslr-amazon-1/dslr
    train_pct: 0.98
    val_pct: 0.01
    num_classes: 31
  image_size: large
  rng_seed: 72
  batch_size: 16
save_locations:
  model_folder: models
  file_folder: files
  image_folder: images
  logs_folder: logs
classifier:
  model: vgg
  identifier: amazon+dslr+1_v2
  num_epochs: 100
unet:
  loss: ebsw
  attention: false
  base_channels: 32
  noise_channels: 8
  num_warm_start_epochs: 20
  num_epochs: 30
verbose: false
